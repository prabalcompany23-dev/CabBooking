{% extends "base.html" %}
{% block title %}Book venue (stub){% endblock %}
{% block content %}
<h1>Book a venue (study stub)</h1>
<p class="muted">Pilot: {{ pilot_city }} · {{ pilot_sport }}</p>
<form method="post" action="/" class="form">
  <label>Your name <input name="player_name" required maxlength="120"></label>
  <label>Contact (phone) <input name="contact" required maxlength="80"></label>
  <label>City <input name="city" required value="{{ pilot_city }}"></label>
  <label>Sport <input name="sport" required value="{{ pilot_sport }}"></label>
  <label>Venue name <input name="venue_name" required maxlength="200"></label>
  <label>Game starts (local) <input type="datetime-local" name="game_starts_at" required></label>
  <label class="checkbox"><input type="checkbox" name="own_vehicle"> I have my own vehicle (no cab needed)</label>
  <button type="submit">Confirm venue booking</button>
</form>
<p class="muted"><a href="/guest">Continue as guest — mobile only</a></p>
{% endblock %}
